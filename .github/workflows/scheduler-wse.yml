name: WSE pipeline (Warsaw close)

on:
  schedule:
    - cron: '15 16 * * 1-5'  # 16:15 UTC weekdays — after WSE close
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  pipeline:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader
        working-directory: market-make

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: uv venv && uv pip install -r requirements.txt
        working-directory: market-make
        env:
          # setup-uv points VIRTUAL_ENV at the repo root; the artisan command
          # looks for the venv at market-make/.venv, so create it there instead
          VIRTUAL_ENV: ${{ github.workspace }}/market-make/.venv

      - name: Fetch WSE prices
        run: php artisan stocks:fetch --symbols=db:.WA
        working-directory: market-make
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_ENV: production
          DB_CONNECTION: pgsql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: 5432
          DB_DATABASE: postgres
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Compute signals
        run: php artisan signals:compute
        working-directory: market-make
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_ENV: production
          DB_CONNECTION: pgsql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: 5432
          DB_DATABASE: postgres
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
